[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skmer-smk2"
version = "0.1.12"
description = "Packaged Snakemake workflow for Skmer, WASTER, and Mash phylogenetic analyses."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
authors = [
    { name = "fandunjin" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
skmer-smk2 = "skmer_smk2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skmer_smk2*"]

[tool.setuptools.package-data]
skmer_smk2 = [
    "workflow/Snakefile",
    "workflow/scripts/*.py",
    "templates/*.sh",
]
